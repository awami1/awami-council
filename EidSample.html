*{margin:0;padding:0;box-sizing:border-box}
body{font-family:‘Saudi’,sans-serif;background:#f5f5f5;padding:40px 20px;direction:rtl}
.container{max-width:800px;margin:0 auto;background:#fff;padding:40px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
h1{text-align:center;color:#2d8659;margin-bottom:30px;font-weight:bold}
.form-grid{display:grid;grid-template-columns:1fr;gap:20px;margin-bottom:30px}
.input-group{}
label{display:block;font-weight:bold;margin-bottom:10px;font-size:16px;color:#333}
input,select{width:100%;padding:16px;border:2px solid #ddd;border-radius:10px;font-size:16px;font-family:‘Saudi’,sans-serif}
select{cursor:pointer}
.btn{width:100%;padding:16px;background:#2d8659;color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;transition:all .3s}
.btn:hover{background:#1a5f3a}
#preview{margin-top:30px;display:none}
canvas{width:100%;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.actions{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-download,.btn-share{padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;transition:all .3s}
.btn-download{background:#2d8659;color:#fff}
.btn-download:hover{background:#1a5f3a}
.btn-share{background:#25D366;color:#fff}
.btn-share:hover{background:#1fb355}
.tip{margin-top:30px;text-align:center;color:#666;font-size:14px;padding:16px;background:#f9f9f9;border-radius:10px}
.font-preview{display:inline-block;padding:8px 16px;background:#f0f0f0;border-radius:8px;margin-top:8px;font-size:20px}

@media (max-width: 768px) {
.container{padding:20px}
.actions{grid-template-columns:1fr}
}

function updateFontSize() {
  var size = document.getElementById('fontSize').value;
  document.getElementById('fontSizeLabel').textContent = size;
  updatePreview();
}

function updatePreview() {
  var name = document.getElementById('nameInput').value || 'مثال على الخط';
  var weight = document.getElementById('fontWeight').value;
  var preview = document.getElementById('namePreview');
  preview.style.fontWeight = weight;
  preview.textContent = name;
}

function generate() {
  var name = document.getElementById('nameInput').value.trim();
  if (!name) {
    alert('الرجاء كتابة اسمك');
    return;
  }
  
  var fontWeight = document.getElementById('fontWeight').value;
  var fontSize = document.getElementById('fontSize').value;
  
  var img = new Image();
  img.onload = function() {
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    
    canvas.width = img.width;
    canvas.height = img.height;
    
    ctx.drawImage(img, 0, 0);
    
    // Set font
    ctx.fillStyle = '#fff';
    ctx.font = fontWeight + ' ' + fontSize + 'px Saudi, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 15;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 3;
    
    // Draw name
    ctx.fillText(name, canvas.width / 2, canvas.height - 200);
    
    document.getElementById('preview').style.display = 'block';
    document.getElementById('preview').scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  
  img.onerror = function() {
    alert('خطأ في تحميل الصورة');
  };
  
  img.src = EID_IMAGE;
}

function download() {
  var canvas = document.getElementById('canvas');
  var link = document.createElement('a');
  var name = document.getElementById('nameInput').value.trim() || 'تهنئة-العيد';
  link.download = name + '-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png', 1.0);
  link.click();
}

function share() {
  var canvas = document.getElementById('canvas');
  canvas.toBlob(function(blob) {
    var name = document.getElementById('nameInput').value.trim() || 'تهنئة-العيد';
    var file = new File([blob], name + '.png', { type: 'image/png' });
    
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({
        files: [file],
        title: 'تهنئة العيد',
        text: 'كل عام وأنتم بخير - مجلس عائلة العوامي'
      }).catch(function(err) {
        console.log('Share failed:', err);
        fallbackShare();
      });
    } else {
      fallbackShare();
    }
  });
}

function fallbackShare() {
  var text = encodeURIComponent('كل عام وأنتم بخير - مجلس عائلة العوامي');
  var whatsappUrl = 'https://wa.me/?text=' + text;
  
  var result = confirm('لم نتمكن من المشاركة المباشرة.\n\nسيتم تحميل الصورة. بعدها يمكنك مشاركتها عبر واتساب يدوياً.');
  
  if (result) {
    window.open(whatsappUrl, '_blank');
  }
  
  download();
}

// Initialize
updatePreview();
</script>
