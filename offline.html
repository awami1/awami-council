<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>غير متصل — مجلس عائلة العوامي</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cairo', 'Tajawal', sans-serif;
    background: #FDFCF8; color: #1a2a1e;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; text-align: center;
  }
  .container { max-width: 400px; }
  .icon { font-size: 64px; margin-bottom: 20px; opacity: .6; }
  h1 { font-size: 22px; font-weight: 700; color: #1A5C32; margin-bottom: 12px; }
  p { font-size: 15px; color: #6b7c6e; line-height: 1.7; margin-bottom: 24px; }
  button {
    background: linear-gradient(135deg, #3D8B37, #1A5C32);
    color: #fff; border: none; padding: 14px 32px; border-radius: 12px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: transform .2s;
  }
  button:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<div class="container">
  <div class="icon">&#128268;</div>
  <h1>أنت غير متصل بالإنترنت</h1>
  <p>يبدو أن اتصالك بالإنترنت مفقود. تأكد من الاتصال وحاول مرة أخرى.</p>
  <button onclick="location.reload()">&#8635; إعادة المحاولة</button>
</div>
</body>
</html>
