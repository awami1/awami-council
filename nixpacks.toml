# Nixpacks configuration for CranL deployment
# يستخدم Nginx + PHP-FPM بدل سيرفر PHP المدمج (single-threaded)

[phases.setup]
nixPkgs = ["nginx"]

[phases.build]
cmds = ["mkdir -p /etc/nginx/conf.d", "composer install --no-dev --optimize-autoloader 2>/dev/null || true"]

[start]
cmd = "bash start-prod.sh"
