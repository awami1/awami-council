## إعدادات nginx لموقع مجلس عائلة العوامي
## ────────────────────────────────────────────
## انسخ هذا الملف إلى /etc/nginx/sites-available/awami
## ثم أنشئ رابط: ln -s /etc/nginx/sites-available/awami /etc/nginx/sites-enabled/
## وأعد تشغيل: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;  # ← غيّر هذا إلى اسم الدومين الخاص بك

    root /home/user/awami-council;
    index index.php;

    charset utf-8;

    # ─── الملفات الثابتة (CSS, JS, صور) ───
    location /public/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── لوحة التحكم ───
    location /admin/ {
        try_files $uri $uri/ /admin/index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # ─── API ───
    location /api/ {
        try_files $uri $uri/ =404;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # ─── Sitemap ───
    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    # ─── توجيه جميع الصفحات إلى router.php ───
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── معالجة PHP ───
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ─── منع الوصول للملفات الحساسة ───
    location ~ /\.ht {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    location ~ \.db$ {
        deny all;
    }

    location = /api/config.php {
        deny all;
    }
}
